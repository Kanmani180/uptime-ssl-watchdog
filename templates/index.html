<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchdog · Uptime &amp; SSL</title>
<style>
  :root {
    --bg: #0d1220;
    --panel: #141b2e;
    --panel-2: #1a2338;
    --line: #273252;
    --text: #e8ecf7;
    --muted: #8e9ac0;
    --ok: #3fd0a0;
    --warn: #f0b24a;
    --down: #f2707a;
    --accent: #7a93ff;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .live { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(63,208,160,.6); animation: pulse 2s infinite; }
  .live.stale .pulse { background: var(--down); animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(63,208,160,0); } 100% { box-shadow: 0 0 0 0 rgba(63,208,160,0); } }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; border-left-width: 4px; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi.total { border-left-color: var(--accent); }
  .kpi.ok { border-left-color: var(--ok); }
  .kpi.warn { border-left-color: var(--warn); }
  .kpi.down { border-left-color: var(--down); }
  .kpi.down.active { background: rgba(242,112,122,.1); border-color: rgba(242,112,122,.45); }
  .kpi.warn.active { background: rgba(240,178,74,.08); border-color: rgba(240,178,74,.4); }

  .add { display: flex; gap: 10px; margin-bottom: 8px; }
  .add input { flex: 1; min-width: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font: inherit; }
  .add input::placeholder { color: #66729a; }
  .add button { background: var(--accent); color: #0b1020; border: 0; border-radius: 10px; padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .add button:hover { filter: brightness(1.1); }
  .msg { min-height: 22px; margin: 0 0 14px; font-size: 13px; color: var(--down); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .table-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 820px; }
  th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: rgba(122,147,255,.04); }
  .site { font-weight: 550; word-break: break-all; }
  .small { color: var(--muted); font-size: 12.5px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; letter-spacing: .04em; white-space: nowrap; }
  .badge.ONLINE { color: var(--ok); background: rgba(63,208,160,.13); }
  .badge.SSL-WARNING { color: var(--warn); background: rgba(240,178,74,.14); }
  .badge.DOWN { color: var(--down); background: rgba(242,112,122,.15); }
  .badge.PENDING { color: var(--muted); background: rgba(142,154,192,.14); }

  .bar { height: 7px; width: 130px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; transition: width .4s ease; }
  .ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .down-t { color: var(--down); }

  .remove { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .remove:hover { color: var(--down); border-color: var(--down); }
  .empty { padding: 36px; text-align: center; color: var(--muted); }

  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 24px; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Watchdog</h1>
      <p class="sub">Uptime and SSL certificate monitoring</p>
    </div>
    <div class="live" id="live"><span class="pulse"></span><span id="liveText">Connecting…</span></div>
  </header>

  <section class="kpis" aria-label="Summary">
    <div class="kpi total"><div class="label">Total monitored</div><div class="value" id="kTotal">0</div></div>
    <div class="kpi ok"><div class="label">Healthy sites</div><div class="value" id="kOk">0</div></div>
    <div class="kpi warn" id="kpiWarn"><div class="label">SSL warnings</div><div class="value" id="kWarn">0</div></div>
    <div class="kpi down" id="kpiDown"><div class="label">Down or unreachable</div><div class="value" id="kDown">0</div></div>
  </section>

  <div class="add">
    <input id="urlInput" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Add a site, for example https://example.com" aria-label="URL to monitor">
    <button id="addBtn" type="button">Add site</button>
  </div>
  <p class="msg" id="msg" role="status"></p>

  <div class="table-card">
    <div class="scroll">
      <table>
        <thead>
          <tr><th>Site</th><th>Status</th><th>HTTP</th><th>Latency</th><th>SSL certificate</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>No sites yet. Add a URL above to start monitoring.</div>
  </div>
</div>

<script>
  const REFRESH_MS = 5000;
  const LATENCY_MAX = 2000; // ms that fills the latency bar
  const $ = (id) => document.getElementById(id);

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function latencyCell(ms) {
    if (ms == null) return '<span class="small">No response</span>';
    const cls = ms < 500 ? "ok" : ms < 1200 ? "warn" : "down";
    const pct = Math.max(4, Math.min(100, (ms / LATENCY_MAX) * 100));
    return `<span class="mono ${cls}-t">${ms} ms</span>
      <div class="bar"><i style="width:${pct}%;background:var(--${cls})"></i></div>`;
  }

  function sslCell(s) {
    if (!s.ssl) return '<span class="small">' + (s.state === "PENDING" ? "Checking…" : "Not HTTPS") + "</span>";
    const x = s.ssl;
    const date = x.expires_at
      ? new Date(x.expires_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })
      : null;
    if (x.state === "expired") {
      const ago = Math.abs(x.days_remaining);
      return `<span class="down-t">Expired ${ago} day${ago === 1 ? "" : "s"} ago</span><div class="small">${esc(date)}</div>`;
    }
    if (x.state === "invalid") {
      return `<span class="down-t">Invalid certificate</span><div class="small">${esc(x.error || "")}</div>`;
    }
    if (x.state === "unknown") {
      return `<span class="warn-t">Could not read certificate</span><div class="small">${esc(x.error || "")}</div>`;
    }
    const cls = x.state === "expiring" ? "warn" : "ok";
    return `<span class="${cls}-t mono">${x.days_remaining} days left</span><div class="small">Expires ${esc(date)}</div>`;
  }

  function render(data) {
    const s = data.summary;
    $("kTotal").textContent = s.total;
    $("kOk").textContent = s.healthy;
    $("kWarn").textContent = s.ssl_warnings;
    $("kDown").textContent = s.down;
    $("kpiWarn").classList.toggle("active", s.ssl_warnings > 0);
    $("kpiDown").classList.toggle("active", s.down > 0);

    $("empty").hidden = data.sites.length > 0;
    $("rows").innerHTML = data.sites.map((site) => {
      const badge = site.state.replace(" ", "-");
      const checked = site.checked_at
        ? "Checked " + new Date(site.checked_at).toLocaleTimeString()
        : "Waiting for first check";
      const http = site.state === "PENDING" ? "—" : esc(site.status_text);
      const httpCls = site.state === "DOWN" ? "down-t" : "";
      return `<tr>
        <td><div class="site">${esc(site.url)}</div><div class="small">${esc(checked)}</div></td>
        <td><span class="badge ${badge}">${site.state === "PENDING" ? "CHECKING" : esc(site.state)}</span></td>
        <td class="${httpCls}">${http}</td>
        <td>${latencyCell(site.latency_ms)}</td>
        <td>${sslCell(site)}</td>
        <td><button class="remove" type="button" data-url="${esc(site.url)}" aria-label="Remove ${esc(site.url)}">Remove</button></td>
      </tr>`;
    }).join("");

    $("live").classList.remove("stale");
    $("liveText").textContent =
      `Live · updated ${new Date(data.generated_at).toLocaleTimeString()} · checks every ${data.check_interval}s`;
  }

  async function refresh() {
    try {
      const res = await fetch("/api/status", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      render(await res.json());
    } catch (err) {
      $("live").classList.add("stale");
      $("liveText").textContent = "Cannot reach the server. Retrying…";
    }
  }

  function showMsg(text) { $("msg").textContent = text || ""; }

  async function addSite() {
    const input = $("urlInput");
    const url = input.value.trim();
    if (!url) { showMsg("Enter a URL, for example https://example.com"); return; }
    showMsg("");
    try {
      const res = await fetch("/api/urls", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || "Could not add the site");
      }
      input.value = "";
      refresh();
      setTimeout(refresh, 2500); // pick up the first check result quickly
    } catch (err) { showMsg(err.message); }
  }

  async function removeSite(url) {
    showMsg("");
    try {
      const res = await fetch("/api/urls?url=" + encodeURIComponent(url), { method: "DELETE" });
      if (!res.ok) throw new Error("Could not remove the site");
      refresh();
    } catch (err) { showMsg(err.message); }
  }

  $("addBtn").addEventListener("click", addSite);
  $("urlInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addSite(); });
  $("rows").addEventListener("click", (e) => {
    const btn = e.target.closest(".remove");
    if (btn) removeSite(btn.dataset.url);
  });

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
